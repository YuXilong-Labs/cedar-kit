# Created by yuxilong on 2026/10/16.
name: Patch and release LookInsideServer

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-ca-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Detect latest upstream release
        id: detect
        run: python3 scripts/release.py detect
      - name: Patch, sign and verify all slices
        if: steps.detect.outputs.needed == 'true'
        run: python3 scripts/release.py build
      - name: Validate generated podspec
        if: steps.detect.outputs.needed == 'true'
        run: |
          ruby -c build/release/LookInsideServer.podspec
          pod ipc spec build/release/LookInsideServer.podspec > build/podspec.json
      - name: Publish complete release
        if: steps.detect.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          # A failed upload leaves a draft; the next run resumes it without exposing partial assets.
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "LookInsideServer $VERSION" \
              --notes-file build/release-notes.md
          fi
          gh release upload "$VERSION" build/release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$VERSION" --draft=false --latest \
            --notes-file build/release-notes.md --repo "$GITHUB_REPOSITORY"
